episodio: CLI-07
titulo: "Histórico e Marketing"
serie: CLI
papel: cliente
duracao: "3:30"
idiomas: [pt]
capitulos:
  - id: CLI-07-C1
    titulo: "Ler o Histórico comercial"
    inicio: "0:00"
    fim: "1:40"
    cenas: [1, 4]
    resumo: "Cada linha é um produto comprado: compras, quantidade, preço, frequência, e botões para comprar de novo."
  - id: CLI-07-C2
    titulo: "Abrir um kit de Marketing e comprar"
    inicio: "1:40"
    fim: "3:30"
    cenas: [5, 8]
    resumo: "A Wellmix oferece o kit com prévia; você compra e baixa os arquivos finais depois da liberação."
perguntas:
  - id: CLI-07-Q1
    tipo: unica
    nivel: 1
    capitulo: CLI-07-C1
    cena: 3
    enunciado: "No Histórico comercial, o que mostra a coluna **Frequência média**?"
    opcoes:
      a: "Quantas compras do produto você fez"
      b: "O intervalo, em dias, entre as compras do mesmo produto"
      c: "A quantidade média por pedido"
      d: "O tempo que o pedido leva para chegar"
    correta: [b]
    explicacao: "Frequência média é o intervalo em dias entre as compras do mesmo produto. Com uma compra só, fica em branco."
  - id: CLI-07-Q2
    tipo: unica
    nivel: 1
    capitulo: CLI-07-C2
    cena: 5
    enunciado: "O que é um kit de Marketing?"
    opcoes:
      a: "Uma promoção de desconto na vitrine"
      b: "Uma caixa de brindes enviada pelo fornecedor"
      c: "Imagens e textos de divulgação do produto, preparados pela Wellmix"
      d: "O relatório de vendas da sua loja"
    correta: [c]
    explicacao: "Marketing é um serviço à parte: a Wellmix prepara um kit de imagens e textos para o seu produto. Você só vê os kits oferecidos a você."
  - id: CLI-07-Q3
    tipo: unica
    nivel: 2
    capitulo: CLI-07-C1
    cena: 4
    enunciado: "No Histórico, João clica em **Comprar de novo** na linha da Jarra. Para onde ele vai?"
    opcoes:
      a: "Direto para uma nova solicitação, já enviada à Wellmix com a mesma quantidade"
      b: "Para Explorar, na página do produto, onde escolhe a quantidade de novo"
      c: "Para o cartão Comprar de novo / Nova proposta do último pedido"
      d: "Para Mensagens, para falar com a Wellmix"
    correta: [c]
    explicacao: "Os botões do Histórico levam ao cartão do pedido (o mesmo do CLI-06), onde você define a nova quantidade."
  - id: CLI-07-Q4
    tipo: vf
    nivel: 2
    capitulo: CLI-07-C1
    cena: 4
    enunciado: "Um pedido que João cancelou continua contando como compra no Histórico."
    opcoes:
      a: "Verdadeiro"
      b: "Falso"
    correta: [b]
    explicacao: "Pedido cancelado não conta como compra. O Histórico só mostra pedidos criados e não cancelados; pedido em andamento já conta."
  - id: CLI-07-Q5
    tipo: ordem
    nivel: 2
    capitulo: CLI-07-C2
    cena: 5
    enunciado: "Coloque na ordem o caminho de um kit de Marketing, do ponto de vista do cliente."
    opcoes:
      a: "A Wellmix faz a oferta e você recebe a prévia"
      b: "Você clica em **Comprar kit**"
      c: "A Wellmix confirma o pagamento"
      d: "Os arquivos finais são liberados para baixar"
    correta: [a, b, c, d]
    explicacao: "O caminho é prévia, oferta, compra, pagamento e liberação. Os arquivos finais só aparecem depois que a Wellmix confirma o pagamento."
  - id: CLI-07-Q6
    tipo: unica
    nivel: 3
    capitulo: CLI-07-C2
    cena: 5
    enunciado: 'João abre Marketing e vê "Nenhum kit oferecido a você ainda." Ele quer um kit para a jarra. O que faz?'
    opcoes:
      a: "Espera: o portal gera o kit sozinho depois de alguns dias, sem ajuda de ninguém"
      b: "Pede o kit pela conversa com a Wellmix, que é quem oferece"
      c: "Clica em **Comprar kit** na vitrine de Explorar, no cartão do produto"
      d: "Cria uma Nova solicitação do tipo kit, descrevendo as imagens que quer"
    correta: [b]
    explicacao: "Quem oferece o kit é a Wellmix. A lista vazia só quer dizer que nenhum kit foi oferecido a você; peça pela conversa com a Wellmix."
  - id: CLI-07-Q7
    tipo: unica
    nivel: 3
    capitulo: CLI-07-C2
    cena: 7
    enunciado: 'João clicou em **Comprar kit** e a tela diz "Compra registrada. Aguardando a confirmação do pagamento pela Wellmix." Ele não vê arquivos em Arquivos finais. Por quê?'
    opcoes:
      a: "Os arquivos foram enviados para o e-mail cadastrado da Loja do João, no mesmo dia"
      b: "O kit foi recusado e precisa ser comprado de novo"
      c: "Só aparecem depois que a Wellmix confirma o pagamento e libera o kit"
      d: "Só a prévia pode ser baixada pelo cliente em qualquer momento"
    correta: [c]
    explicacao: 'O cartão "Arquivos finais" avisa que eles são liberados após a confirmação do pagamento. Quando a Wellmix libera, você é avisado no sino.'
  - id: CLI-07-Q8
    tipo: unica
    nivel: 3
    capitulo: CLI-07-C2
    cena: 6
    enunciado: "João quer avaliar o kit antes de comprar. Ele pode baixar alguma coisa?"
    opcoes:
      a: "Não: nada é visível antes da compra"
      b: "Sim, os arquivos finais, com marca d'água"
      c: "Só depois de a Wellmix confirmar o pagamento"
      d: "Sim, as prévias, que ficam visíveis desde a oferta, com o link **Baixar**"
    correta: [d]
    explicacao: "As prévias aparecem desde a oferta e podem ser baixadas. Os arquivos finais só aparecem depois da compra e da liberação."
