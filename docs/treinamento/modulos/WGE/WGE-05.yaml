episodio: WGE-05
titulo: Painel do dono e fluxo de caixa
serie: WGE
papel: administrador
duracao: "3:30"
idiomas: [pt]
capitulos:
  - id: WGE-05-C1
    titulo: Ler os cartões do Painel do dono
    inicio: "0:00"
    fim: "1:28"
    cenas: [1, 4]
    resumo: Abra Gestão → Painel do dono e leia os quatro cartões de dinheiro e a linha de estoque e operação.
  - id: WGE-05-C2
    titulo: Acompanhar vendas, maiores clientes e o fluxo de caixa
    inicio: "1:28"
    fim: "2:38"
    cenas: [5, 6]
    resumo: Veja o gráfico, as listas e abra o Fluxo de caixa previsto, semana a semana.
  - id: WGE-05-C3
    titulo: Reagir ao saldo negativo e à falta de câmbio
    inicio: "2:38"
    fim: "3:30"
    cenas: [7, 9]
    resumo: Entenda o alerta de saldo negativo, as linhas especiais e o que o operador não vê.
perguntas:
  - id: WGE-05-Q1
    tipo: unica
    nivel: 1
    capitulo: WGE-05-C1
    cena: 3
    enunciado: "Qual cartão do Painel do dono mostra também o total que ainda falta receber dos clientes?"
    opcoes:
      a: "Vendas do mês"
      b: "Margem do mês"
      c: "Recebido no mês"
      d: "Pago a fornecedores no mês"
    correta: [c]
    explicacao: "**Recebido no mês** traz, junto, o 'A receber (total)'. O cartão **Pago a fornecedores no mês** faz o mesmo para o lado do fornecedor, com 'A pagar a fornecedores'."
  - id: WGE-05-Q2
    tipo: unica
    nivel: 1
    capitulo: WGE-05-C2
    cena: 6
    enunciado: "Qual tela mostra, semana a semana, as Entradas, as Saídas e o Saldo acumulado previstos?"
    opcoes:
      a: "Vendas dos últimos 6 meses"
      b: "Pedidos em andamento por etapa"
      c: "Maiores clientes (12 meses)"
      d: "Fluxo de caixa previsto"
    correta: [d]
    explicacao: "O **Fluxo de caixa** (botão no alto do Painel do dono ou em Gestão → Fluxo de caixa) traz a tabela por semana, com Entradas, Saídas e os dois saldos."
  - id: WGE-05-Q3
    tipo: multipla
    nivel: 2
    capitulo: WGE-05-C1
    cena: 4
    enunciado: "Quais destes cartões estão na linha de baixo do Painel do dono, a de estoque e operação? Marque todos."
    opcoes:
      a: "Estoque (valor de custo)"
      b: "Aguardando sinal"
      c: "Solicitações em aberto"
      d: "Margem do mês"
      e: "Recebido no mês"
    correta: [a, b, c]
    explicacao: "A linha de baixo traz **Estoque (valor de custo)**, **Perdas no último inventário**, **Solicitações em aberto**, **Aguardando sinal** e **Pedidos em andamento**. Margem e Recebido ficam na linha do alto."
  - id: WGE-05-Q4
    tipo: unica
    nivel: 2
    capitulo: WGE-05-C2
    cena: 6
    enunciado: "O que entra como **Saída** no Fluxo de caixa previsto?"
    opcoes:
      a: "O sinal que ainda espera pagamento"
      b: "As parcelas dos fornecedores, pelo vencimento"
      c: "O saldo de cada pedido, na entrega prevista"
      d: "As multas abertas dos pedidos"
    correta: [b]
    explicacao: "Saem as parcelas aos fornecedores, pelo vencimento. Entram o sinal que ainda espera pagamento e o saldo de cada pedido, na data prevista da entrega."
  - id: WGE-05-Q5
    tipo: vf
    nivel: 2
    capitulo: WGE-05-C1
    cena: 4
    enunciado: "Verdadeiro ou falso: as compras para estoque contam como venda nos números do Painel do dono."
    opcoes:
      a: "Verdadeiro"
      b: "Falso"
    correta: [b]
    explicacao: "Compras para estoque não contam como venda. O estoque aparece à parte, no cartão **Estoque (valor de custo)**."
  - id: WGE-05-Q6
    tipo: unica
    nivel: 3
    capitulo: WGE-05-C3
    cena: 7
    enunciado: "No Fluxo de caixa aparece o alerta vermelho 'Atenção: o saldo acumulado fica negativo...'. O que ele indica?"
    opcoes:
      a: "Há uma multa aberta na semana citada"
      b: "O cliente não pagou o sinal"
      c: "É a primeira semana em que as saídas passam das entradas"
      d: "O câmbio do dia está faltando"
    correta: [c]
    explicacao: "O alerta aponta a primeira semana em que o saldo acumulado fica abaixo de zero, isto é, em que as saídas passam das entradas. Falta de câmbio tem outro aviso, em âmbar."
  - id: WGE-05-Q7
    tipo: unica
    nivel: 3
    capitulo: WGE-05-C3
    cena: 7
    enunciado: "Aparece o aviso âmbar 'Sem câmbio do dia para USD: essas saídas aparecem na moeda delas, mas ficam fora do saldo em reais.' O que você faz?"
    opcoes:
      a: "Em Configurações → Preço ao cliente, clica em **Buscar cotações**"
      b: "Registra um recebimento do cliente em dólar"
      c: "Marca as parcelas como pagas"
      d: "Cria um fluxo de caixa novo para o dólar"
    correta: [a]
    explicacao: "O saldo em reais usa o câmbio do dia. Buscar as cotações em Configurações → Preço ao cliente resolve; sem câmbio, o portal não inventa valor."
  - id: WGE-05-Q8
    tipo: unica
    nivel: 3
    capitulo: WGE-05-C3
    cena: 8
    enunciado: "O Otávio, operador planner, digita o endereço do Painel do dono. O que acontece?"
    opcoes:
      a: "O painel abre, mas sem os valores"
      b: "Ele volta para os Painéis por área"
      c: "Aparece uma página não encontrada"
      d: "Só o Fluxo de caixa abre"
    correta: [b]
    explicacao: "O Painel do dono e o Fluxo de caixa são só de quem abre o Financeiro. Quem força o endereço volta aos Painéis por área."
