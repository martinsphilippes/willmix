episodio: LOG-01
titulo: "Agente de carga: reserva no navio e BL"
serie: LOG
papel: logistics
duracao: "3:40"
idiomas: [pt]
capitulos:
  - id: LOG-01-C1
    titulo: "Abrir a pendência e ler os seus passos"
    inicio: "0:00"
    fim: "1:30"
    cenas: [1, 4]
    resumo: "Abra a pendência **Booking** (a reserva no navio) e veja no cartão quais passos são seus e quem valida cada um."
  - id: LOG-01-C2
    titulo: "Informar a reserva e enviar o Draft do BL"
    inicio: "1:30"
    fim: "2:45"
    cenas: [5, 6]
    resumo: "Digite o número da reserva, espere a validação da Wellmix e envie o Draft do BL, corrigindo se a comex recusar."
  - id: LOG-01-C3
    titulo: "Enviar o BL original"
    inicio: "2:45"
    fim: "3:40"
    cenas: [7, 8]
    resumo: "Com o rascunho validado, envie o número e o arquivo do BL original e saiba quem o vê."
perguntas:
  - id: LOG-01-Q1
    tipo: unica
    nivel: 1
    capitulo: LOG-01-C1
    cena: 3
    enunciado: "Qual linha de Minhas pendências é a reserva no navio?"
    opcoes:
      a: "Desembaraço: pedido #1"
      b: "Embarque: pedido #1"
      c: "Draft do BL: pedido #1"
      d: "Booking: pedido #1"
    correta: [d]
    explicacao: "A linha **Booking: pedido #N**, do tipo Embarque e desembaraço, é a reserva do espaço no navio. Clique em **Abrir** para ir ao cartão do pedido."
  - id: LOG-01-Q2
    tipo: multipla
    nivel: 1
    capitulo: LOG-01-C1
    cena: 4
    enunciado: "Dos passos do cartão **Embarque e desembaraço**, quais são seus?"
    opcoes:
      a: "Booking"
      b: "Invoice e packing list"
      c: "Draft do BL"
      d: "Presença de carga"
      e: "BL (original)"
    correta: [a, c, e]
    explicacao: "Três passos são seus: **Booking**, **Draft do BL** e **BL (original)**. Os outros seis que você vê são só leitura, e numerário, DI e CI nem aparecem para o agente de carga."
  - id: LOG-01-Q3
    tipo: unica
    nivel: 2
    capitulo: LOG-01-C1
    cena: 4
    enunciado: "Na coluna \"Quem faz / valida\", quem confere o Booking e quem confere os BLs?"
    opcoes:
      a: "A Wellmix confere o Booking; a comex confere os BLs"
      b: "A comex confere o Booking; a Wellmix confere os BLs"
      c: "A Wellmix confere tudo"
      d: "A comex confere o Booking e o BL, mas não o Draft"
    correta: [a]
    explicacao: "No Booking aparece \"Faz: agente de carga · valida: Wellmix\". No Draft do BL e no BL (original), \"valida: comex\"."
  - id: LOG-01-Q4
    tipo: unica
    nivel: 2
    capitulo: LOG-01-C2
    cena: 5
    enunciado: "Você digitou o **Nº do booking** e clicou em **Enviar**. O que libera o **Draft do BL** para você?"
    opcoes:
      a: "A Wellmix validar a reserva"
      b: "A comex validar o número"
      c: "Clicar em **Enviar** uma segunda vez"
      d: "O pedido chegar ao Transporte"
    correta: [a]
    explicacao: "A linha passa a \"Enviado, aguardando validação\". Quando a Wellmix valida, o Booking fica Concluído e só então o próximo passo, o Draft do BL, libera para você."
  - id: LOG-01-Q5
    tipo: ordem
    nivel: 2
    capitulo: LOG-01-C2
    cena: 6
    enunciado: "Coloque na ordem os seus três passos."
    opcoes:
      a: "Draft do BL"
      b: "BL (original)"
      c: "Booking (Nº do booking)"
    correta: [c, a, b]
    explicacao: "Cada passo mostra \"Depois de: …\": o Draft do BL vem depois do Booking, e o BL (original) depois do Draft do BL. Cada um só libera quando o anterior é validado."
  - id: LOG-01-Q6
    tipo: unica
    nivel: 3
    capitulo: LOG-01-C2
    cena: 6
    enunciado: "A comex recusou o Draft do BL com o motivo \"Peso bruto diferente da invoice\". A linha mostra **Recusado**. O que você faz?"
    opcoes:
      a: "Envia o Booking de novo, para a Wellmix revalidar"
      b: "Espera: a comex corrige o arquivo por conta própria"
      c: "Valida o rascunho você mesmo, para liberar o BL"
      d: "Corrige o arquivo e clica em **Enviar de novo**"
    correta: [d]
    explicacao: "Você recebe o aviso \"Draft do BL recusado\" com o motivo. Corrija o arquivo e use **Enviar de novo** na mesma linha; a comex confere outra vez."
  - id: LOG-01-Q7
    tipo: unica
    nivel: 3
    capitulo: LOG-01-C3
    cena: 7
    enunciado: "Você quer enviar o **BL (original)**, mas o passo mostra \"Depois de: Draft do BL\" e não deixa enviar. O que falta?"
    opcoes:
      a: "A comex validar o Draft do BL"
      b: "Informar a Presença de carga"
      c: "O fornecedor assinar a invoice"
      d: "A Wellmix validar o BL antes do rascunho"
    correta: [a]
    explicacao: "Fora de ordem o portal responde \"Conclua antes o passo anterior.\" Quando a comex valida o rascunho, você recebe \"sua vez, BL (original)\" e pode digitar o **Nº do BL**, escolher o arquivo e clicar em **Enviar**."
  - id: LOG-01-Q8
    tipo: multipla
    nivel: 3
    capitulo: LOG-01-C3
    cena: 7
    enunciado: "Um colega pergunta quem consegue ver o BL (original) depois que você o envia. Marque todos que veem."
    opcoes:
      a: "O agente de carga"
      b: "O fornecedor"
      c: "O cliente"
      d: "A comex"
      e: "O despachante"
    correta: [a, b, d, e]
    explicacao: "Veem o BL o agente de carga, a comex, o fornecedor e o despachante. O cliente não está nessa lista."
