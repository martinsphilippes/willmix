# Trilhas de treinamento: quais módulos cada tipo de login deve concluir, na ordem.
# Fonte: a tabela "Trilhas" de docs/videos/README.md (que segue docs/ACCESS.md).
# Quando a matriz de telas mudar, ajuste aqui também. Os IDs são os de modulos/<SÉRIE>/<ID>.yaml.
#
# chave        : identificador estável da trilha
# nome         : como aparece para o aluno
# quem         : login que recebe a trilha (papel do portal; operador:função = função em Equipe e divisões)
# modulos      : na ordem recomendada; todos contam para o percentual da trilha
# extras       : módulos que não contam no percentual, só ficam disponíveis (o aluno pode assistir por curiosidade)

- chave: customer
  nome: "Cliente"
  quem: "customer"
  modulos: [GER-00, GER-01, GER-02, CLI-01, CLI-02, CLI-03, CLI-04, CLI-05, CLI-06, CLI-07]

