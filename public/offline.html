<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bf2026" />
    <title>Sem conexão · Wellmix</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #f5f5f6; color: #18181b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      main { max-width: 26rem; margin: 1.5rem; text-align: center; }
      .logo { display: inline-flex; background: #bf2026; border-radius: 0.75rem; padding: 0.75rem 1rem; }
      .logo img { height: 2rem; display: block; }
      h1 { font-size: 1.375rem; margin: 1.25rem 0 0.5rem; }
      p { margin: 0.25rem 0; color: #52525b; line-height: 1.5; }
      .other { font-size: 0.875rem; color: #71717a; margin-top: 0.75rem; }
      button {
        margin-top: 1.25rem; min-height: 2.75rem; padding: 0 1.25rem;
        border: 0; border-radius: 0.75rem; background: #bf2026; color: #fff;
        font-size: 1rem; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="logo"><img src="/brand/wellmix-logo-white.svg" alt="Wellmix" /></span>
      <h1>Sem conexão com a internet</h1>
      <p>O Portal Wellmix precisa de internet para mostrar pedidos e pendências. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
      <p class="other">No internet connection. Check your network and try again.</p>
      <p class="other">没有网络连接。请检查网络后重试。</p>
      <button type="button" onclick="location.reload()">Tentar de novo · Retry · 重试</button>
    </main>
    <script>
      // Voltou a rede: recarrega sozinho.
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
